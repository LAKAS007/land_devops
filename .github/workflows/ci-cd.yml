name: Version update pipeline

on:
  pull_request:
    types: [closed]
    branches:
    - release

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions: 
      contents: write
    outputs: 
      old_v: ${{steps.get-old-v.outputs.OLD_VERSION}}
      new_v: ${{steps.get-new-v.outputs.NEW_VERSION}}
    steps:

    - name: Get branch names
      id: branch-names
      uses: tj-actions/branch-names@v8

    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.13.2'

    # Get old version
    - name: get old_version 
      id: get-old-v
      run: |
        OLD_VERSION=$(cat .github/workflows/version.txt)
        echo "${OLD_VERSION}"
        echo "OLD_VERSION=${OLD_VERSION}" >> $GITHUB_OUTPUT

    - name: update minor
      if: startsWith(steps.branch-names.outputs.current_branch, 'feature')
      run: |
        cd ./.github/workflows
        python versionUpdateScript.py minor

    - name: update patch 
      if: startsWith(steps.branch-names.outputs.current_branch, 'hotfix')  
      run: |
        cd ./.github/workflows
        python versionUpdateScript.py patch

    # Get new version
    - name: get new_version 
      id: get-new-v
      run: |
        NEW_VERSION=$(cat .github/workflows/version.txt)
        echo "${NEW_VERSION}"
        echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_OUTPUT

    - name: Configure Git
      run: |
        git config user.name "Github Actions Bot"
        git config user.email "<>"

    - name: Commit and push changes
      run: |
        git add .
        git commit -m "Update [${{steps.get-new-v.outputs.NEW_VERSION}}] <- [${{steps.get-old-v.outputs.OLD_VERSION}}]"
        git push -u origin release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Add changelog entry
    - name: Update changelog.md
      run: |
        NEW_VERSION=${{ steps.get-new-v.outputs.NEW_VERSION }}
        BRANCH=${{ steps.branch-names.outputs.current_branch }}
        DATE=$(date "+%Y-%m-%d")
        echo "### Version $NEW_VERSION - $DATE" >> changelog.md
        echo "- Merged branch: $BRANCH" >> changelog.md
        git add changelog.md
        git commit -m "Update changelog for version $NEW_VERSION"
        git push

    # Upload changelog as artifact
    - name: Upload changelog as artifact
      uses: actions/upload-artifact@v3
      with:
        name: changelog
        path: changelog.md

    - name: test
      run: echo "PR number is ${{ inputs.pr_number }}"

  security:
    name: (SEC) Security
    needs: run-script
    uses: LAKAS007/land_devops/.github/workflows/security.yml@release
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
      id-token: write
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets:
      ACTIONS_PAT: ${{ secrets.ACTIONS_PAT }}

  test-fixme:
    name: (TST)
    needs: security
    uses: LAKAS007/land_devops/.github/workflows/tests.yml@release
    with:
      version: alpha
